<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>腦力探險家 · IQ 練習場</title>
<meta name="description" content="給國小孩童的互動式 IQ 練習網頁。引導式解析,玩中學、想中玩。">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 題庫卡片新增的 count 顯示 */
  .topic-count {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
    opacity: 0.7;
  }
  .diff-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .diff-btn:disabled:hover {
    transform: none;
    box-shadow: var(--shadow-sm);
  }
</style>
</head>
<body>

<div class="celebration" id="celebration">🎉</div>

<div class="container">
  <button class="mute-btn" id="muteBtn" onclick="onMuteClick()" title="切換音效">🔊</button>

  <div class="header">
    <h1 class="title"><span class="title-emoji">🧠</span>腦力探險家</h1>
    <p class="subtitle">六大題型 × 三種難度 · IQ 練習場</p>
  </div>

  <!-- MENU -->
  <div id="menuScreen">
    <!-- 測驗模式入口 (banner,跟學習卡片區隔) -->
    <button class="test-mode-banner" onclick="openTestSetup()">
      <span class="banner-emoji">📝</span>
      <span class="banner-text">
        <span class="banner-title">綜合測驗</span>
        <span class="banner-sub">沒有提示,做完才看答案。挑戰自己 ✨</span>
      </span>
      <span class="banner-arrow">→</span>
    </button>

    <div class="menu-section-label">📚 學習模式 · 練習六大題型</div>
    <div class="menu-grid" id="menuGrid">
      <div class="loading">載入題庫中</div>
    </div>

    <!-- 系統 / 網站回饋入口 (不是單題的) -->
    <div class="system-feedback-row">
      <button class="system-feedback-btn" onclick="openSystemFeedback()">
        💬 對網站有想法?跟我們說
      </button>
      <div class="system-feedback-hint">功能建議、bug、希望多哪類題目 — 都歡迎</div>
    </div>

    <!-- About 頁連結 -->
    <div class="about-link-row">
      <a href="about.html" class="about-link">💗 關於這個專案 · 為什麼我們做這個網站</a>
    </div>
  </div>

  <!-- TEST SETUP -->
  <div id="testSetupScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="card test-setup-card">
      <span class="card-badge">📝 測驗設定</span>
      <h2 class="setup-h2">準備好挑戰自己嗎?</h2>
      <p class="setup-intro">測驗模式<strong>沒有提示</strong>、選了不能改、做完才看答案。盡力試試看!</p>

      <div class="setup-section">
        <div class="setup-h3">① 選題型 (可多選)</div>
        <div class="chip-row" id="setupTopics"></div>
      </div>

      <div class="setup-section">
        <div class="setup-h3">② 難度</div>
        <div class="chip-row" id="setupLevels"></div>
      </div>

      <div class="setup-section">
        <div class="setup-h3">③ 題數</div>
        <div class="chip-row" id="setupCount"></div>
      </div>

      <div class="setup-section">
        <div class="setup-h3">④ 時限</div>
        <div class="chip-row" id="setupTime"></div>
      </div>

      <div class="setup-summary" id="setupSummary"></div>

      <div class="actions">
        <button class="btn btn-ghost" onclick="goMenu()">取消</button>
        <button class="btn btn-primary" id="startTestBtn" onclick="startTest()">開始測驗 →</button>
      </div>
    </div>
  </div>

  <!-- TEST QUIZ -->
  <div id="testQuizScreen" class="hide">
    <div class="test-header-row">
      <button class="back-btn" onclick="confirmExitTest()">← 中途離開</button>
      <div class="test-timer" id="testTimer">⏱ —</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="testProgress"></div></div>
    <div class="progress-text" id="testProgressText"></div>
    <div id="testQuizArea"></div>
  </div>

  <!-- TEST RESULT -->
  <div id="testResultScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="final-screen test-result">
      <div class="trophy">🏆</div>
      <h2 class="final-title">測驗完成!</h2>
      <p class="score-display" id="testFinalScore"></p>
      <div class="stats stats-4">
        <div class="stat-box"><div class="stat-value" id="testStatCorrect">0</div><div class="stat-label">答對</div></div>
        <div class="stat-box"><div class="stat-value" id="testStatTotal">0</div><div class="stat-label">總題</div></div>
        <div class="stat-box"><div class="stat-value" id="testStatRate">0%</div><div class="stat-label">正確率</div></div>
        <div class="stat-box"><div class="stat-value" id="testStatTime">0:00</div><div class="stat-label">用時</div></div>
      </div>

      <div id="testRadarSlot"></div>

      <div class="test-review-section">
        <div class="test-review-title">📋 逐題回顧</div>
        <div id="testReviewList"></div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" onclick="goMenu()">回主選單</button>
        <button class="btn btn-primary" onclick="startNewTest()">再測一次 🔁</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="progress-text" id="progressText"></div>
    <div id="quizArea"></div>
  </div>

  <!-- FINAL -->
  <div id="finalScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="final-screen">
      <div class="trophy">🏆</div>
      <h2 class="final-title">這一關完成!</h2>
      <p class="score-display" id="finalScore"></p>
      <div class="stats">
        <div class="stat-box"><div class="stat-value" id="statCorrect">0</div><div class="stat-label">答對</div></div>
        <div class="stat-box"><div class="stat-value" id="statTotal">0</div><div class="stat-label">總題數</div></div>
        <div class="stat-box"><div class="stat-value" id="statRate">0%</div><div class="stat-label">正確率</div></div>
      </div>

      <!-- 累計能力雷達圖 + 圖例 -->
      <div id="radarSlot"></div>

      <!-- 這關錯題回顧 -->
      <div id="wrongSlot"></div>

      <div class="actions">
        <button class="btn btn-ghost" onclick="restartLevel()">重玩這關 🔁</button>
        <button class="btn btn-primary" onclick="goMenu()">挑戰其他關 →</button>
      </div>

      <!-- 紀錄管理 -->
      <div class="record-tools">
        <button class="record-btn" onclick="onExportRecords()">📤 匯出我的紀錄</button>
        <button class="record-btn danger" onclick="onClearRecords()">🗑 清除紀錄</button>
      </div>
      <div class="record-privacy">資料只存在這個瀏覽器,不會上傳。換手機或清瀏覽器資料會歸零。</div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
