<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>腦力探險家 · IQ 練習場</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8E7;
    --bg-paper: #FFFFFF;
    --ink: #2D2A4A;
    --ink-soft: #6B6890;
    --primary: #FF6B9D;
    --primary-deep: #E84A82;
    --secondary: #4ECDC4;
    --accent: #FFD93D;
    --purple: #9B7EDE;
    --orange: #FF9F45;
    --success: #6BCB77;
    --error: #FF8C8C;
    --shadow: 0 6px 0 rgba(45, 42, 74, 0.15);
    --shadow-hover: 0 4px 0 rgba(45, 42, 74, 0.15);
    --shadow-sm: 0 3px 0 rgba(45, 42, 74, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255, 217, 61, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(78, 205, 196, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255, 107, 157, 0.1) 0%, transparent 50%);
    min-height: 100vh;
    color: var(--ink);
    padding: 20px;
    overflow-x: hidden;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 24px 16px 24px;
  }

  .title {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -0.02em;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .title-emoji {
    font-size: 1.2em;
    display: inline-block;
    animation: wiggle 3s ease-in-out infinite;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 16px;
    margin-top: 8px;
    font-weight: 500;
  }

  /* ============ MENU ============ */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
    margin-top: 24px;
  }

  .topic-card {
    background: var(--bg-paper);
    border: 4px solid var(--ink);
    border-radius: 24px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .topic-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 rgba(45, 42, 74, 0.15);
  }

  .topic-card .topic-emoji {
    font-size: 44px;
    margin-bottom: 10px;
    display: block;
  }

  .topic-card .topic-name {
    font-size: 20px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .topic-card .topic-desc {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .difficulty-row {
    display: flex;
    gap: 8px;
  }

  .diff-btn {
    flex: 1;
    background: white;
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    padding: 8px 4px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    transition: all 0.15s;
  }

  .diff-btn:hover {
    transform: translateY(1px);
    box-shadow: 0 2px 0 rgba(45, 42, 74, 0.15);
  }

  .diff-btn.easy { background: #E8F8E0; }
  .diff-btn.mid  { background: #FFF3D6; }
  .diff-btn.hard { background: #FFE0E8; }

  .topic-card.matrix     { background: linear-gradient(135deg, #FFFFFF 0%, #FFF0F5 100%); }
  .topic-card.sequence   { background: linear-gradient(135deg, #FFFFFF 0%, #E8FCFB 100%); }
  .topic-card.spatial    { background: linear-gradient(135deg, #FFFFFF 0%, #F0EAFB 100%); }
  .topic-card.numseries  { background: linear-gradient(135deg, #FFFFFF 0%, #FFFAE0 100%); }
  .topic-card.analogy    { background: linear-gradient(135deg, #FFFFFF 0%, #FFEFE0 100%); }
  .topic-card.multivar   { background: linear-gradient(135deg, #FFFFFF 0%, #EFEDFA 100%); }

  /* ============ QUIZ ============ */
  .back-btn {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    font-family: inherit;
    margin-bottom: 16px;
  }

  .back-btn:hover { transform: translateY(1px); box-shadow: 0 2px 0 rgba(45, 42, 74, 0.15); }

  .progress-bar {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 999px;
    height: 18px;
    margin-bottom: 6px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0%;
  }

  .progress-text {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  /* CARD */
  .card {
    background: var(--bg-paper);
    border: 4px solid var(--ink);
    border-radius: 28px;
    padding: 32px 24px 24px;
    box-shadow: var(--shadow);
    position: relative;
  }

  .card-badge {
    position: absolute;
    top: -14px;
    left: 24px;
    background: var(--accent);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }

  .card-stars {
    position: absolute;
    top: -14px;
    right: 24px;
    background: var(--purple);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 700;
    color: white;
  }

  .question-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.6;
    margin-top: 8px;
    margin-bottom: 22px;
    color: var(--ink);
  }

  .question-visual {
    background: #FAFAFF;
    border: 2px dashed #D5D2EC;
    border-radius: 20px;
    padding: 24px 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 140px;
  }

  /* ============ MATRIX 3x3 ============ */
  .matrix-3x3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 320px;
  }
  .matrix-2x2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 220px;
  }
  .matrix-cell {
    aspect-ratio: 1;
    background: white;
    border: 3px solid var(--ink);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .matrix-cell.unknown {
    background: var(--accent);
    font-size: 32px;
    font-weight: 900;
    color: var(--ink);
  }

  /* ============ SEQUENCE ============ */
  .shape-sequence {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .shape-cell {
    width: 64px;
    height: 64px;
    background: white;
    border: 3px solid var(--ink);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .shape-cell.unknown {
    background: var(--accent);
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
  }
  .arrow {
    font-size: 20px;
    color: var(--ink-soft);
    font-weight: 700;
  }

  /* ============ NUMBER ============ */
  .number-sequence {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .num-cell {
    min-width: 56px;
    height: 56px;
    background: white;
    border: 3px solid var(--ink);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    padding: 0 12px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .num-cell.unknown { background: var(--accent); color: var(--ink); }

  /* ============ ANALOGY ============ */
  .analogy-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }
  .analogy-row .arr { color: var(--ink-soft); }
  .analogy-row .term {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 10px 16px;
    box-shadow: 2px 2px 0 var(--ink);
    min-width: 70px;
    text-align: center;
  }
  .analogy-row .term.unknown { background: var(--accent); }

  /* ============ OPTIONS ============ */
  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .options.shape-options { grid-template-columns: repeat(4, 1fr); }
  .options.text-options  { grid-template-columns: repeat(2, 1fr); }

  .option {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 14px 12px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: var(--shadow-sm);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 64px;
    font-family: inherit;
    flex-direction: column;
  }

  .option:hover:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(45, 42, 74, 0.15);
    background: #FFFBF0;
  }
  .option:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 0 0 rgba(45, 42, 74, 0.15);
  }
  .option .label {
    background: var(--secondary);
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    flex-shrink: 0;
  }
  .option .opt-text {
    font-size: 14px;
  }
  .option.correct {
    background: var(--success);
    color: white;
    border-color: #4FAF5C;
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .option.correct .label { background: white; color: var(--success); }
  .option.incorrect {
    background: var(--error);
    color: white;
    border-color: #E66B6B;
    animation: shake 0.5s;
  }
  .option.incorrect .label { background: white; color: var(--error); }
  .option:disabled { cursor: not-allowed; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  /* ============ FEEDBACK ============ */
  .feedback {
    margin-top: 20px;
    padding: 18px;
    border-radius: 18px;
    border: 3px solid var(--ink);
    background: #FFFBF0;
    box-shadow: var(--shadow-sm);
    display: none;
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .feedback.show { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 12px;
  }
  .feedback.correct .feedback-header { color: var(--success); }
  .feedback.incorrect .feedback-header { color: var(--primary-deep); }
  .feedback-emoji { font-size: 26px; }

  .hint-question {
    background: white;
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 10px 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.6;
  }
  .hint-question::before { content: '🤔 '; }

  .explanation {
    font-size: 15px;
    line-height: 1.75;
    color: var(--ink);
    margin: 10px 0;
    font-weight: 500;
  }
  .explanation strong {
    background: var(--accent);
    padding: 1px 6px;
    border-radius: 5px;
    font-weight: 700;
  }
  .skill-tag {
    display: inline-block;
    background: var(--secondary);
    color: white;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    margin-top: 10px;
  }

  /* ============ ACTIONS ============ */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1;
    min-width: 120px;
    padding: 14px 18px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s;
    font-family: inherit;
    color: var(--ink);
  }
  .btn:hover { transform: translateY(1px); box-shadow: 0 2px 0 rgba(45, 42, 74, 0.15); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(45, 42, 74, 0.15); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-ghost { background: white; }

  /* ============ FINAL ============ */
  .final-screen {
    text-align: center;
    padding: 30px 20px;
    background: var(--bg-paper);
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: var(--shadow);
  }
  .trophy {
    font-size: 70px;
    animation: bounce 1.5s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .final-title { font-size: 28px; font-weight: 900; margin: 16px 0 4px; color: var(--ink); }
  .score-display { font-size: 16px; color: var(--ink-soft); margin-bottom: 22px; font-weight: 600; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 22px 0;
  }
  .stat-box {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 14px 6px;
    box-shadow: var(--shadow-sm);
  }
  .stat-value { font-size: 26px; font-weight: 900; color: var(--primary); }
  .stat-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-top: 4px; }

  .celebration {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
    font-size: 70px;
    opacity: 0;
  }
  .celebration.show {
    animation: celebrate 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes celebrate {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-30deg); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(15deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }

  @media (max-width: 520px) {
    .options.shape-options { grid-template-columns: repeat(2, 1fr); }
    .question-text { font-size: 16px; }
    .matrix-3x3 { max-width: 260px; }
    .matrix-cell svg { width: 80%; height: 80%; }
    .shape-cell { width: 52px; height: 52px; }
    .num-cell { min-width: 48px; height: 48px; font-size: 18px; padding: 0 10px; }
  }

  .hide { display: none !important; }
</style>
</head>
<body>

<div class="celebration" id="celebration">🎉</div>

<div class="container">
  <div class="header">
    <h1 class="title"><span class="title-emoji">🧠</span>腦力探險家</h1>
    <p class="subtitle">六大題型 × 三種難度 · IQ 練習場</p>
  </div>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="progress-text" id="progressText"></div>
    <div id="quizArea"></div>
  </div>

  <!-- FINAL -->
  <div id="finalScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="final-screen">
      <div class="trophy">🏆</div>
      <h2 class="final-title">這一關完成!</h2>
      <p class="score-display" id="finalScore"></p>
      <div class="stats">
        <div class="stat-box"><div class="stat-value" id="statCorrect">0</div><div class="stat-label">答對</div></div>
        <div class="stat-box"><div class="stat-value" id="statTotal">0</div><div class="stat-label">總題數</div></div>
        <div class="stat-box"><div class="stat-value" id="statRate">0%</div><div class="stat-label">正確率</div></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="restartLevel()">重玩這關 🔁</button>
        <button class="btn btn-primary" onclick="goMenu()">挑戰其他關 →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SVG HELPERS
   ============================================================ */
function svg(content, size = 50) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;
}
function circle(c, r=16, cx=25, cy=25, stroke='#2D2A4A') {
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" stroke="${stroke}" stroke-width="2.5"/>`;
}
function square(c, side=28, x=11, y=11) {
  return `<rect x="${x}" y="${y}" width="${side}" height="${side}" rx="3" fill="${c}" stroke="#2D2A4A" stroke-width="2.5"/>`;
}
function triangle(c) {
  return `<polygon points="25,8 42,38 8,38" fill="${c}" stroke="#2D2A4A" stroke-width="2.5" stroke-linejoin="round"/>`;
}
function star(c) {
  return `<polygon points="25,6 30,19 44,19 33,28 37,42 25,34 13,42 17,28 6,19 20,19" fill="${c}" stroke="#2D2A4A" stroke-width="2" stroke-linejoin="round"/>`;
}
function diamond(c) {
  return `<polygon points="25,6 42,25 25,44 8,25" fill="${c}" stroke="#2D2A4A" stroke-width="2.5" stroke-linejoin="round"/>`;
}
function hex(c) {
  return `<polygon points="25,6 41,15 41,35 25,44 9,35 9,15" fill="${c}" stroke="#2D2A4A" stroke-width="2.5" stroke-linejoin="round"/>`;
}
function arrow(deg, c='#FF6B9D') {
  return `<g transform="rotate(${deg} 25 25)"><path d="M 25 8 L 25 40 M 14 19 L 25 8 L 36 19" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>`;
}
function dots(n) {
  const positions = {
    1: [[25,25]],
    2: [[15,25],[35,25]],
    3: [[15,15],[25,35],[35,15]],
    4: [[15,15],[35,15],[15,35],[35,35]],
    5: [[15,15],[35,15],[25,25],[15,35],[35,35]],
    6: [[15,12],[35,12],[15,25],[35,25],[15,38],[35,38]]
  };
  if (!positions[n]) return '';
  return positions[n].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="#2D2A4A"/>`).join('');
}
function multiShape(shape, n, c) {
  if (n === 1) return shape(c);
  if (n === 2) return `<g transform="translate(-9,0) scale(0.6) translate(8,15)">${shape(c)}</g><g transform="translate(9,0) scale(0.6) translate(8,15)">${shape(c)}</g>`;
  if (n === 3) return `<g transform="scale(0.5) translate(0,10)">${shape(c)}</g><g transform="scale(0.5) translate(50,10)">${shape(c)}</g><g transform="scale(0.5) translate(25,50)">${shape(c)}</g>`;
  if (n === 4) return `<g transform="scale(0.45) translate(5,5)">${shape(c)}</g><g transform="scale(0.45) translate(55,5)">${shape(c)}</g><g transform="scale(0.45) translate(5,55)">${shape(c)}</g><g transform="scale(0.45) translate(55,55)">${shape(c)}</g>`;
  return shape(c);
}
/* ============================================================
   ISOMETRIC CUBE STACK
   ------------------------------------------------------------
   cubeStack(layout, options?) — 畫等角投影立方體堆
   layout:
     1D [n]                       → 一列
     2D [[1,1,1],[0,1,0]]         → 平面圖 z=0 一層
     3D [[[],[]],[[],[]]]         → 多層 layout[z][y][x]
   options:
     size: 單位邊長 px (預設 24)
     colors: { top, left, right, edge }
     padding: SVG 邊距 (預設 10)
   ============================================================ */
const ISO_COLORS = {
  top:   '#FFD93D',   // yellow
  left:  '#FF9F45',   // orange
  right: '#FF6B9D',   // pink
  edge:  '#2D2A4A'
};
function isoProject(x, y, z, s) {
  const cos30 = Math.cos(Math.PI / 6);  // ≈ 0.866
  const sin30 = Math.sin(Math.PI / 6);  // = 0.5
  return {
    sx: (x - y) * cos30 * s,
    sy: (x + y) * sin30 * s - z * s
  };
}
function isoCube(x, y, z, s, neighbors, colors) {
  const p = {
    blf: isoProject(x,   y,   z,   s),
    brf: isoProject(x+1, y,   z,   s),
    blb: isoProject(x,   y+1, z,   s),
    brb: isoProject(x+1, y+1, z,   s),
    tlf: isoProject(x,   y,   z+1, s),
    trf: isoProject(x+1, y,   z+1, s),
    tlb: isoProject(x,   y+1, z+1, s),
    trb: isoProject(x+1, y+1, z+1, s)
  };
  const poly = (pts, fill) => {
    const d = pts.map(pt => `${pt.sx.toFixed(2)},${pt.sy.toFixed(2)}`).join(' ');
    return `<polygon points="${d}" fill="${fill}" stroke="${colors.edge}" stroke-width="1.5" stroke-linejoin="round"/>`;
  };
  const faces = [];
  if (!neighbors.px) faces.push(poly([p.brf, p.brb, p.trb, p.trf], colors.right));
  if (!neighbors.py) faces.push(poly([p.blb, p.brb, p.trb, p.tlb], colors.left));
  if (!neighbors.pz) faces.push(poly([p.tlf, p.trf, p.trb, p.tlb], colors.top));
  return faces.join('');
}
function cubeStack(layout, options = {}) {
  const s = options.size || 24;
  const colors = options.colors || ISO_COLORS;
  const padding = options.padding || 10;

  // 正規化成 3D
  let l3;
  if (typeof layout[0] === 'number')          l3 = [[layout]];
  else if (typeof layout[0][0] === 'number')  l3 = [layout];
  else                                        l3 = layout;

  // 蒐集 cells + 建鄰居索引
  const cells = [];
  const set = new Set();
  for (let z = 0; z < l3.length; z++)
    for (let y = 0; y < l3[z].length; y++)
      for (let x = 0; x < l3[z][y].length; x++)
        if (l3[z][y][x]) { cells.push({x, y, z}); set.add(`${x},${y},${z}`); }
  if (cells.length === 0) return `<svg width="60" height="60"></svg>`;
  const has = (x, y, z) => set.has(`${x},${y},${z}`);

  // Painter sort: 等角投影下「遠」= x+y 小,「近」= x+y 大
  cells.sort((a, b) => (a.x + a.y) - (b.x + b.y) || a.z - b.z);

  // Bounding box
  const pts = [];
  cells.forEach(({x, y, z}) => {
    for (const dx of [0,1]) for (const dy of [0,1]) for (const dz of [0,1])
      pts.push(isoProject(x+dx, y+dy, z+dz, s));
  });
  const minX = Math.min(...pts.map(p => p.sx));
  const maxX = Math.max(...pts.map(p => p.sx));
  const minY = Math.min(...pts.map(p => p.sy));
  const maxY = Math.max(...pts.map(p => p.sy));
  const W = maxX - minX + padding * 2;
  const H = maxY - minY + padding * 2;
  const tx = -minX + padding;
  const ty = -minY + padding;

  const body = cells.map(c => isoCube(c.x, c.y, c.z, s, {
    px: has(c.x + 1, c.y, c.z),
    py: has(c.x, c.y + 1, c.z),
    pz: has(c.x, c.y, c.z + 1)
  }, colors)).join('');

  return `<svg width="${W.toFixed(0)}" height="${H.toFixed(0)}" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(${tx.toFixed(2)}, ${ty.toFixed(2)})">${body}</g>
  </svg>`;
}
// Color palette

// Matrix cell builder
function mc(content, isUnknown = false) {
  return `<div class="matrix-cell${isUnknown ? ' unknown' : ''}">${isUnknown ? '?' : content}</div>`;
}

/* ============================================================
   TOPIC METADATA
   ============================================================ */
const TOPICS = {
  matrix:    { emoji: '🎯', name: '矩陣推理', desc: '3×3 經典題型,找出橫和直的規律', cls: 'matrix' },
  sequence:  { emoji: '🔄', name: '圖形序列', desc: '形狀、顏色、旋轉的規律變化',  cls: 'sequence' },
  spatial:   { emoji: '🧊', name: '空間能力', desc: '折紙、立方體展開、方塊計數', cls: 'spatial' },
  numseries: { emoji: '🔢', name: '進階數列', desc: '從等差到費氏,數字裡的秘密', cls: 'numseries' },
  analogy:   { emoji: '🔗', name: '類比推理', desc: 'A 之於 B,如同 C 之於?',     cls: 'analogy' },
  multivar:  { emoji: '🌈', name: '多元素變化', desc: '同時追蹤形狀、顏色、數量等多個變數', cls: 'multivar' }
};

/* ============================================================
   STATE & RENDER
   ============================================================ */
let state = {
  topic: null,
  level: null,
  qList: [],
  idx: 0,
  correct: 0,
  answered: false
};

function renderMenu() {
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = Object.entries(TOPICS).map(([key, t]) => `
    <div class="topic-card ${t.cls}">
      <span class="topic-emoji">${t.emoji}</span>
      <div class="topic-name">${t.name}</div>
      <div class="topic-desc">${t.desc}</div>
      <div class="difficulty-row">
        <button class="diff-btn easy" onclick="startLevel('${key}','easy')">⭐ 入門</button>
        <button class="diff-btn mid" onclick="startLevel('${key}','mid')">⭐⭐ 中階</button>
        <button class="diff-btn hard" onclick="startLevel('${key}','hard')">⭐⭐⭐ 挑戰</button>
      </div>
    </div>
  `).join('');
}

function startLevel(topic, level) {
  state.topic = topic;
  state.level = level;
  state.qList = QUESTIONS[topic][level];
  state.idx = 0;
  state.correct = 0;
  state.answered = false;
  document.getElementById('menuScreen').classList.add('hide');
  document.getElementById('finalScreen').classList.add('hide');
  document.getElementById('quizScreen').classList.remove('hide');
  renderQuestion();
}

function renderQuestion() {
  state.answered = false;
  const q = state.qList[state.idx];
  const topic = TOPICS[state.topic];
  const levelLabel = { easy: '⭐ 入門', mid: '⭐⭐ 中階', hard: '⭐⭐⭐ 挑戰' }[state.level];

  document.getElementById('progress').style.width = (state.idx / state.qList.length * 100) + '%';
  document.getElementById('progressText').textContent = `${topic.name} · ${levelLabel} · 第 ${state.idx + 1} 題 / 共 ${state.qList.length} 題`;

  // 決定選項格式
  const hasHtml = q.options.some(o => o.html);
  const optClass = hasHtml ? 'shape-options' : 'text-options';

  document.getElementById('quizArea').innerHTML = `
    <div class="card">
      <span class="card-badge">${topic.emoji} ${topic.name}</span>
      <span class="card-stars">${levelLabel}</span>
      <div class="question-text">${q.prompt}</div>
      <div class="question-visual">${q.visual}</div>
      <div class="options ${optClass}">
        ${q.options.map((opt, i) => `
          <button class="option" data-idx="${i}" onclick="selectAnswer(${i})">
            <span class="label">${['A','B','C','D'][i]}</span>
            ${opt.html || ''}
            <span class="opt-text">${opt.text}</span>
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions" id="actions" style="display:none;">
        <button class="btn btn-primary" onclick="nextQuestion()">
          ${state.idx < state.qList.length - 1 ? '下一題 →' : '看成績 🏁'}
        </button>
      </div>
    </div>
  `;
}

function selectAnswer(idx) {
  if (state.answered) return;
  state.answered = true;
  const q = state.qList[state.idx];
  const correct = idx === q.answer;
  if (correct) state.correct++;

  document.querySelectorAll('.option').forEach((btn, i) => {
    btn.disabled = true;
    if (i === idx) btn.classList.add(correct ? 'correct' : 'incorrect');
    if (i === q.answer && !correct) btn.classList.add('correct');
  });

  const feedback = document.getElementById('feedback');
  feedback.classList.add('show', correct ? 'correct' : 'incorrect');

  if (correct) {
    feedback.innerHTML = `
      <div class="feedback-header"><span class="feedback-emoji">🎉</span>答對了!</div>
      <div class="explanation">${q.explanation}</div>
      <div class="skill-tag">✨ 練到的能力:${q.skill}</div>
    `;
    showCelebration();
  } else {
    feedback.innerHTML = `
      <div class="feedback-header"><span class="feedback-emoji">💪</span>沒關係,我們一起想想!</div>
      <div class="hint-question">${q.hint}</div>
      <div class="explanation">${q.explanation}</div>
      <div class="skill-tag">✨ 練習重點:${q.skill}</div>
    `;
  }
  document.getElementById('actions').style.display = 'flex';
}

function nextQuestion() {
  state.idx++;
  if (state.idx >= state.qList.length) {
    showFinal();
  } else {
    renderQuestion();
  }
}

function showFinal() {
  document.getElementById('progress').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hide');
  document.getElementById('finalScreen').classList.remove('hide');

  const rate = Math.round(state.correct / state.qList.length * 100);
  const topic = TOPICS[state.topic];
  const levelLabel = { easy: '入門', mid: '中階', hard: '挑戰' }[state.level];
  let comment;
  if (rate === 100) comment = `${topic.name}·${levelLabel}關 完美通關!🌟`;
  else if (rate >= 80) comment = `${topic.name}·${levelLabel}關 表現很棒!🚀`;
  else if (rate >= 60) comment = `${topic.name}·${levelLabel}關 持續加油!💪`;
  else comment = `${topic.name}·${levelLabel}關 多練幾次會更好!🌱`;

  document.getElementById('finalScore').textContent = comment;
  document.getElementById('statCorrect').textContent = state.correct;
  document.getElementById('statTotal').textContent = state.qList.length;
  document.getElementById('statRate').textContent = rate + '%';
}

function goMenu() {
  document.getElementById('quizScreen').classList.add('hide');
  document.getElementById('finalScreen').classList.add('hide');
  document.getElementById('menuScreen').classList.remove('hide');
}

function restartLevel() {
  startLevel(state.topic, state.level);
}

function showCelebration() {
  const el = document.getElementById('celebration');
  el.textContent = ['🎉', '⭐', '🌟', '✨', '🎊'][Math.floor(Math.random() * 5)];
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

renderMenu();
</script>
