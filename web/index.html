<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>腦力探險家 · IQ 練習場</title>
<meta name="description" content="給國小孩童的互動式 IQ 練習網頁。引導式解析,玩中學、想中玩。">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 題庫卡片新增的 count 顯示 */
  .topic-count {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 10px;
    opacity: 0.7;
  }
  .diff-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .diff-btn:disabled:hover {
    transform: none;
    box-shadow: var(--shadow-sm);
  }
</style>
</head>
<body>

<div class="celebration" id="celebration">🎉</div>

<div class="container">
  <button class="mute-btn" id="muteBtn" onclick="onMuteClick()" title="切換音效">🔊</button>

  <div class="header">
    <h1 class="title"><span class="title-emoji">🧠</span>腦力探險家</h1>
    <p class="subtitle">六大題型 × 三種難度 · IQ 練習場</p>
  </div>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="menu-grid" id="menuGrid">
      <div class="loading">載入題庫中</div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="progress-text" id="progressText"></div>
    <div id="quizArea"></div>
  </div>

  <!-- FINAL -->
  <div id="finalScreen" class="hide">
    <button class="back-btn" onclick="goMenu()">← 回主選單</button>
    <div class="final-screen">
      <div class="trophy">🏆</div>
      <h2 class="final-title">這一關完成!</h2>
      <p class="score-display" id="finalScore"></p>
      <div class="stats">
        <div class="stat-box"><div class="stat-value" id="statCorrect">0</div><div class="stat-label">答對</div></div>
        <div class="stat-box"><div class="stat-value" id="statTotal">0</div><div class="stat-label">總題數</div></div>
        <div class="stat-box"><div class="stat-value" id="statRate">0%</div><div class="stat-label">正確率</div></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="restartLevel()">重玩這關 🔁</button>
        <button class="btn btn-primary" onclick="goMenu()">挑戰其他關 →</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
