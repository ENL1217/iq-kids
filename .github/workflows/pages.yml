name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'questions/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to SHA for supply-chain safety. Update via:
        # gh api repos/actions/checkout/git/refs/tags --jq '[.[] | select(.ref | startswith("refs/tags/v4."))] | sort_by(.ref) | reverse | .[0]'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Validate questions
        run: node tools/validate.mjs

      - name: Build manifest
        run: node tools/build-manifest.mjs

      - name: Stage deployable content
        # Deploy web/ as the site root, with questions/ alongside so the
        # frontend can fetch ./questions/manifest.json at runtime.
        # Manifest is freshly generated above so it always matches the JSON files.
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp -r questions _site/questions
          ls -la _site
          echo "--- manifest summary ---"
          node -e "const m=require('./questions/manifest.json'); const c=Object.entries(m.topics).map(([k,v])=>k+':'+(v.easy.length+v.mid.length+v.hard.length)).join(' '); console.log('Total topics:', c);"

      - name: Cache-bust JS modules and CSS
        # Inject the commit SHA into HTML files (replaces __VERSION__) and
        # into all JS import statements so submodules also bust on each
        # deploy. Without this, browser ES-module cache could keep the
        # frontend stuck on an old version after deploys.
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Injecting version: $VERSION"
          # Replace __VERSION__ placeholder in HTML files
          find _site -name "*.html" -exec sed -i "s/__VERSION__/$VERSION/g" {} \;
          # Add ?v=$VERSION to every relative .js import in JS files
          # Matches: from './foo.js' OR from "./foo.js"  (we use single quotes by convention)
          find _site/js -name "*.js" -exec sed -i "s|from '\\./\\([^']*\\.js\\)'|from './\\1?v=$VERSION'|g" {} \;
          # Sanity check: show how many imports got versioned
          echo "Versioned imports:"
          grep -rh "from '\\./[^']*\\.js?v=" _site/js | wc -l
          echo "Example HTML script tag:"
          grep -h "script.*src=.js" _site/index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
